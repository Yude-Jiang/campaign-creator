name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # No provider keys are configured, so nothing here may reach a live LLM.
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t campaign-factory:ci .

      - name: Boot and health-check
        # Catches the class of Dockerfile bug where $PORT has no default and the
        # container exits immediately.
        run: |
          docker run -d --name cf -p 8080:8080 campaign-factory:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "container is serving"
              docker rm -f cf
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          docker logs cf
          exit 1
